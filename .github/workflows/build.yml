name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # attach the plugin zip to releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning .github/rulesets/apply.sh get.sh install.sh uninstall.sh lib/*.sh voice/install-voice.sh decky-plugin/install.sh \
            bin/claude-session bin/claude-session-inner bin/claude-open-url \
            $(grep -rlE '^#!/usr/bin/env bash|^#!/bin/bash' skills knowledge lib)

      - name: Check Python syntax
        run: |
          python3 -m py_compile decky-plugin/main.py bin/claude-notify bin/claude-tts bin/sidequest-update-check
          for f in $(grep -rlE '^#!/usr/bin/env python3' skills knowledge lib); do python3 -m py_compile "$f"; done

      - name: Update check tests
        run: python3 ci/test-update-check.py

      - name: Security scanner tests
        run: python3 -m unittest discover -s .github/security

      - name: Check devices and skills
        run: pip install --quiet pyyaml && python3 ci/check-devices.py

      - name: Install / uninstall test (throwaway home)
        run: |
          sudo apt-get install -y -qq tmux
          ci/test-install.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Decky plugin
        working-directory: decky-plugin
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Package
        run: |
          mkdir -p out/sidequest/dist
          cp decky-plugin/plugin.json decky-plugin/package.json decky-plugin/main.py LICENSE THIRD_PARTY_NOTICES README.md out/sidequest/
          cp decky-plugin/dist/index.js out/sidequest/dist/
          (cd out && zip -qr sidequest.zip sidequest)
          sha256sum out/sidequest.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sidequest
          path: out/sidequest.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/sidequest.zip
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
