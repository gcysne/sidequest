name: build

on:
  push:
    branches: [main, release/alpha]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # attach the plugin zip to releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh uninstall.sh lib/common.sh voice/install-voice.sh decky-plugin/install.sh bin/claude-session bin/claude-session-inner bin/claude-open-url

      - name: Check Python syntax
        run: python3 -m py_compile decky-plugin/main.py bin/claude-notify bin/claude-tts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Decky plugin
        working-directory: decky-plugin
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Package
        run: |
          mkdir -p out/claude-deck/dist
          cp decky-plugin/plugin.json decky-plugin/package.json decky-plugin/main.py LICENSE THIRD_PARTY_NOTICES README.md out/claude-deck/
          cp decky-plugin/dist/index.js out/claude-deck/dist/
          (cd out && zip -qr claude-deck.zip claude-deck)
          sha256sum out/claude-deck.zip

      - uses: actions/upload-artifact@v4
        with:
          name: claude-deck
          path: out/claude-deck.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/claude-deck.zip
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
