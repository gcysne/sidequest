# claude-deck: touch-drag scrolls instead of selecting.
# In Game Mode the touchscreen arrives as a left-button drag. Each row the finger moves:
#  - app that grabs the mouse (Claude Code's full-screen view): one SGR wheel event at the pointer
#  - plain shell: tmux copy-mode scrollback (leaves copy mode at the bottom)
# Taps still go through as clicks. Text selection by drag is given up for this.
bind -n MouseDown1Pane select-pane -t = \; set -F @touch_y '#{mouse_y}' \; send -M
bind -n MouseDrag1Pane if -F '#{mouse_any_flag}' { if -F '#{>:#{mouse_y},#{@touch_y}}' { run -C 'send -l "\e[<64;#{e|+:#{mouse_x},1};#{e|+:#{mouse_y},1}M"' } { if -F '#{<:#{mouse_y},#{@touch_y}}' { run -C 'send -l "\e[<65;#{e|+:#{mouse_x},1};#{e|+:#{mouse_y},1}M"' } } } { if -F '#{>:#{mouse_y},#{@touch_y}}' { copy-mode -e ; send -X scroll-up } { if -F '#{&&:#{<:#{mouse_y},#{@touch_y}},#{pane_in_mode}}' { send -X scroll-down } } } \; set -F @touch_y '#{mouse_y}'
bind -n MouseDragEnd1Pane if -F '#{mouse_any_flag}' { run -C 'send -l "\e[<0;#{e|+:#{mouse_x},1};#{e|+:#{mouse_y},1}m"' }
bind -T copy-mode-vi MouseDown1Pane select-pane \; set -F @touch_y '#{mouse_y}'
bind -T copy-mode-vi MouseDrag1Pane if -F '#{>:#{mouse_y},#{@touch_y}}' { send -X scroll-up } { if -F '#{<:#{mouse_y},#{@touch_y}}' { send -X scroll-down } } \; set -F @touch_y '#{mouse_y}'
bind -T copy-mode-vi MouseDragEnd1Pane set -u @touch_y
